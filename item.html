<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <title>Item Bin Card - Pro UI</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-soft: #eff6ff;
            --primary-border: #bfdbfe;
            --page-bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --header-from: #1e40af;
            --header-to: #2563eb;
            --ring: rgba(37,99,235,.20);
        }

        html { scroll-behavior: smooth; }
        body {
            background: var(--page-bg);
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
            transition: background-color .25s ease, color .25s ease;
        }

        .theme-header {
            background: linear-gradient(135deg, var(--header-from), var(--header-to)) !important;
        }
        .theme-primary-bg { background-color: var(--primary) !important; }
        .theme-primary-bg:hover { background-color: var(--primary-dark) !important; }
        .theme-primary-text { color: var(--primary) !important; }
        .theme-primary-soft { background-color: var(--primary-soft) !important; }
        .theme-primary-border { border-color: var(--primary-border) !important; }
        .theme-primary-ring:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 4px var(--ring) !important;
        }
        .theme-top-border { border-top-color: var(--primary) !important; }

        .theme-card {
            background: var(--card-bg) !important;
            transition: background-color .25s ease, border-color .25s ease;
        }

        .fade-in {
            animation: fadeIn .45s cubic-bezier(.4,0,.2,1) forwards;
            opacity: 0;
            transform: translateY(10px);
        }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        .delay-1 { animation-delay: .1s; }
        .delay-2 { animation-delay: .2s; }

        .modal-glass {
            background: rgba(255,255,255,.96);
            backdrop-filter: blur(12px);
        }

        .fab-pulse { animation: pulse-ring 2s cubic-bezier(.4,0,.6,1) infinite; }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 var(--ring); }
            70% { box-shadow: 0 0 0 15px transparent; }
            100% { box-shadow: 0 0 0 0 transparent; }
        }

        .search-dropdown {
            max-height: 310px;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .search-result-item { cursor: pointer; }
        .search-result-item:hover { background: var(--primary-soft) !important; }

        .settings-panel {
            max-height: min(80vh, 620px);
            overflow-y: auto;
        }

        .theme-choice {
            border: 2px solid #e5e7eb;
            transition: all .2s ease;
        }
        .theme-choice:hover {
            transform: translateY(-1px);
            border-color: var(--primary-border);
        }
        .theme-choice.active {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--ring);
        }

        .theme-dot {
            width: 34px;
            height: 34px;
            border-radius: 9999px;
            flex: 0 0 auto;
        }

        .theme-ocean { --primary:#2563eb; --primary-dark:#1d4ed8; --primary-soft:#eff6ff; --primary-border:#bfdbfe; --page-bg:#f3f4f6; --header-from:#1e40af; --header-to:#2563eb; --ring:rgba(37,99,235,.20); }
        .theme-emerald { --primary:#059669; --primary-dark:#047857; --primary-soft:#ecfdf5; --primary-border:#a7f3d0; --page-bg:#f1f5f4; --header-from:#065f46; --header-to:#059669; --ring:rgba(5,150,105,.20); }
        .theme-violet { --primary:#7c3aed; --primary-dark:#6d28d9; --primary-soft:#f5f3ff; --primary-border:#ddd6fe; --page-bg:#f5f3f7; --header-from:#5b21b6; --header-to:#7c3aed; --ring:rgba(124,58,237,.20); }
        .theme-rose { --primary:#e11d48; --primary-dark:#be123c; --primary-soft:#fff1f2; --primary-border:#fecdd3; --page-bg:#f7f3f4; --header-from:#9f1239; --header-to:#e11d48; --ring:rgba(225,29,72,.20); }
        .theme-amber { --primary:#d97706; --primary-dark:#b45309; --primary-soft:#fffbeb; --primary-border:#fde68a; --page-bg:#f7f5ef; --header-from:#92400e; --header-to:#d97706; --ring:rgba(217,119,6,.20); }
        .theme-slate { --primary:#475569; --primary-dark:#334155; --primary-soft:#f1f5f9; --primary-border:#cbd5e1; --page-bg:#eef2f6; --header-from:#1e293b; --header-to:#475569; --ring:rgba(71,85,105,.20); }

        .settings-backdrop, .search-backdrop { display:none; }
        .settings-backdrop.open, .search-backdrop.open { display:block; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<script>
(() => {
    'use strict';

    // ==========================================
    // FIREBASE CONFIGURATION
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyDUbL9Q28whHtr1JQ-J1HzFO-ybQa11y0U",
        authDomain: "qr-to-bin-card.firebaseapp.com",
        projectId: "qr-to-bin-card",
        storageBucket: "qr-to-bin-card.firebasestorage.app",
        messagingSenderId: "64518992022",
        appId: "1:64518992022:web:4e55b994b91765064ad2b7",
        measurementId: "G-9PHQBG7F88"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ==========================================
    // ITEM URL TOKEN
    // ==========================================
    const ITEM_URL_SECRET = 'BinCard-Item-URL-v2-2026';

    function bytesToBase64Url(bytes) {
        let binary = '';
        bytes.forEach(b => binary += String.fromCharCode(b));
        return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    }

    function base64UrlToBytes(value) {
        const base64 = value.replace(/-/g, '+').replace(/_/g, '/') +
            '='.repeat((4 - value.length % 4) % 4);
        const binary = atob(base64);
        return Uint8Array.from(binary, ch => ch.charCodeAt(0));
    }

    async function getItemCryptoKey() {
        const digest = await crypto.subtle.digest(
            'SHA-256',
            new TextEncoder().encode(ITEM_URL_SECRET)
        );
        return crypto.subtle.importKey(
            'raw',
            digest,
            { name: 'AES-GCM' },
            false,
            ['encrypt', 'decrypt']
        );
    }

    async function createItemToken(materialCode) {
        const key = await getItemCryptoKey();
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ciphertext = await crypto.subtle.encrypt(
            { name: 'AES-GCM', iv },
            key,
            new TextEncoder().encode(String(materialCode || '').trim())
        );
        const combined = new Uint8Array(iv.length + ciphertext.byteLength);
        combined.set(iv, 0);
        combined.set(new Uint8Array(ciphertext), iv.length);
        return bytesToBase64Url(combined);
    }

    async function decryptItemToken(token) {
        try {
            if (!token) return '';
            const payload = base64UrlToBytes(token);
            if (payload.length <= 12) return '';
            const iv = payload.slice(0, 12);
            const ciphertext = payload.slice(12);
            const key = await getItemCryptoKey();
            const plain = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv },
                key,
                ciphertext
            );
            return new TextDecoder().decode(plain).trim();
        } catch (e) {
            console.error('Invalid item URL token:', e);
            return '';
        }
    }

    // ==========================================
    // STATE
    // ==========================================
    let currentMaterialCode = '';
    let safeDocId = '';
    let baseOpeningStock = 0;

    let allItemsCache = [];
    let searchLoadPromise = null;
    let searchRequestId = 0;
    let currentTheme = localStorage.getItem('binCardTheme') || 'ocean';

    const body = document.getElementById('app-body');
    const searchBox = document.getElementById('search-box-container');
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const searchStatus = document.getElementById('search-status');
    const searchToggle = document.getElementById('search-toggle');
    const searchClear = document.getElementById('search-clear');

    const settingsModal = document.getElementById('settings-modal');
    const settingsToggle = document.getElementById('settings-toggle');
    const settingsClose = document.getElementById('settings-close');

    const modal = document.getElementById('transaction-modal');
    const modalContent = document.getElementById('modal-content');

    // ==========================================
    // SMALL UTILITIES
    // ==========================================
    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function normalizeSearchValue(value) {
        return String(value ?? '').trim().toLocaleLowerCase();
    }

    function getLocalDateString(date = new Date()) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    function toNumber(value) {
        const n = Number(value);
        return Number.isFinite(n) ? n : 0;
    }

    function getItemCode(data, docId = '') {
        return String(
            data?.materialCode ??
            data?.material_code ??
            data?.code ??
            docId ??
            ''
        ).trim();
    }

    // ==========================================
    // THEMES
    // ==========================================
    function applyTheme(themeName) {
        const allowed = ['ocean', 'emerald', 'violet', 'rose', 'amber', 'slate'];
        const theme = allowed.includes(themeName) ? themeName : 'ocean';

        body.className = body.className
            .replace(/\btheme-(ocean|emerald|violet|rose|amber|slate)\b/g, '')
            .trim();
        body.classList.add(`theme-${theme}`);

        currentTheme = theme;
        localStorage.setItem('binCardTheme', theme);

        document.querySelectorAll('.theme-choice').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.theme === theme);
            btn.setAttribute('aria-pressed', btn.dataset.theme === theme ? 'true' : 'false');
        });

        const metaTheme = document.querySelector('meta[name="theme-color"]');
        const colors = {
            ocean: '#2563eb',
            emerald: '#059669',
            violet: '#7c3aed',
            rose: '#e11d48',
            amber: '#d97706',
            slate: '#475569'
        };
        if (metaTheme) metaTheme.setAttribute('content', colors[theme]);
    }

    function openSettings() {
        settingsModal.classList.remove('hidden');
        settingsModal.classList.add('flex');
        settingsToggle.setAttribute('aria-expanded', 'true');
    }

    function closeSettings() {
        settingsModal.classList.add('hidden');
        settingsModal.classList.remove('flex');
        settingsToggle.setAttribute('aria-expanded', 'false');
    }

    // ==========================================
    // SEARCH
    // ==========================================
    function toggleSearchBox(force) {
        const shouldOpen = typeof force === 'boolean'
            ? force
            : searchBox.classList.contains('hidden');

        if (shouldOpen) {
            searchBox.classList.remove('hidden');
            searchToggle.setAttribute('aria-expanded', 'true');

            setTimeout(() => {
                searchInput.focus();
                searchInput.select();
            }, 20);

            loadItemsForSearch().then(() => {
                if (normalizeSearchValue(searchInput.value)) {
                    filterItems(searchInput.value);
                }
            });
        } else {
            searchBox.classList.add('hidden');
            searchToggle.setAttribute('aria-expanded', 'false');
            searchResults.classList.add('hidden');
            searchStatus.classList.add('hidden');
        }
    }

    async function loadItemsForSearch(force = false) {
        if (!force && allItemsCache.length) return allItemsCache;
        if (!force && searchLoadPromise) return searchLoadPromise;

        searchStatus.textContent = 'අයිතම ලැයිස්තුව ලබාගනිමින්...';
        searchStatus.classList.remove('hidden');

        searchLoadPromise = (async () => {
            try {
                const snapshot = await db.collection('items').get();
                const items = [];

                snapshot.forEach(doc => {
                    const data = doc.data() || {};
                    const materialCode = getItemCode(data, doc.id);
                    const materialName = String(
                        data.materialName ??
                        data.material_name ??
                        data.name ??
                        '-'
                    ).trim() || '-';

                    if (!materialCode) return;

                    items.push({
                        id: doc.id,
                        materialCode,
                        materialName
                    });
                });

                items.sort((a, b) =>
                    a.materialCode.localeCompare(
                        b.materialCode,
                        undefined,
                        { numeric: true, sensitivity: 'base' }
                    )
                );

                allItemsCache = items;
                searchStatus.textContent = `${items.length} items loaded`;
                return items;
            } catch (e) {
                console.error('Error fetching items for search:', e);
                allItemsCache = [];
                searchStatus.textContent = 'Search data ලබාගැනීමට නොහැකි විය.';
                throw e;
            } finally {
                searchLoadPromise = null;
            }
        })();

        return searchLoadPromise;
    }

    async function filterItems(query) {
        const requestId = ++searchRequestId;
        const q = normalizeSearchValue(query);

        if (!q) {
            searchResults.innerHTML = '';
            searchResults.classList.add('hidden');
            searchStatus.classList.add('hidden');
            return;
        }

        searchResults.classList.remove('hidden');
        searchResults.innerHTML = `
            <div class="p-4 text-center text-gray-400 text-xs">
                <i class="fas fa-spinner fa-spin mr-1"></i> Searching...
            </div>
        `;

        try {
            const items = await loadItemsForSearch();

            // User may have changed the query while Firestore was loading.
            if (requestId !== searchRequestId) return;

            const filtered = items.filter(item => {
                const code = normalizeSearchValue(item.materialCode);
                const name = normalizeSearchValue(item.materialName);
                return code.includes(q) || name.includes(q);
            }).slice(0, 50);

            if (!filtered.length) {
                searchResults.innerHTML = `
                    <div class="p-4 text-center text-xs text-gray-400">
                        <i class="fas fa-box-open mb-2 block text-lg"></i>
                        අයිතම හමු නොවීය
                    </div>
                `;
                return;
            }

            const currentUrl = `${window.location.origin}${window.location.pathname}`;

            // Generate tokens in parallel instead of one-by-one.
            const rows = await Promise.all(filtered.map(async item => {
                const token = await createItemToken(item.materialCode);
                const link = `${currentUrl}#item=${encodeURIComponent(token)}`;

                return `
                    <a href="${escapeHtml(link)}"
                       class="search-result-item block p-3 transition rounded-lg"
                       data-material-code="${escapeHtml(item.materialCode)}">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-lg theme-primary-soft theme-primary-text flex items-center justify-center shrink-0">
                                <i class="fas fa-box"></i>
                            </div>
                            <div class="min-w-0">
                                <p class="font-bold text-sm theme-primary-text truncate">${escapeHtml(item.materialCode)}</p>
                                <p class="text-xs text-gray-600 truncate">${escapeHtml(item.materialName)}</p>
                            </div>
                            <i class="fas fa-chevron-right ml-auto text-xs text-gray-300"></i>
                        </div>
                    </a>
                `;
            }));

            if (requestId !== searchRequestId) return;

            searchResults.innerHTML = rows.join('');
            searchResults.classList.remove('hidden');
        } catch (e) {
            if (requestId !== searchRequestId) return;
            searchResults.innerHTML = `
                <div class="p-4 text-center text-xs text-red-400">
                    Search එකේදී දෝෂයක් ඇතිවිය. නැවත උත්සාහ කරන්න.
                </div>
            `;
        }
    }

    function clearSearch() {
        searchRequestId++;
        searchInput.value = '';
        searchResults.innerHTML = '';
        searchResults.classList.add('hidden');
        searchStatus.classList.add('hidden');
        searchInput.focus();
    }

    // ==========================================
    // BIN CARD
    // ==========================================
    async function loadItemBinCard(showError = true) {
        if (!currentMaterialCode) {
            document.getElementById('display-mat-name').innerText = 'Code Missing!';
            document.getElementById('display-mat-code').innerText = '---';

            if (showError) {
                Swal.fire(
                    'Error',
                    'Material Code එකක් ලබාදී නොමැත. Admin Panel හෝ QR Code එක හරහා පිවිසෙන්න.',
                    'error'
                );
            }
            return;
        }

        document.getElementById('display-mat-code').innerText = currentMaterialCode;

        try {
            const itemDoc = await db.collection('items').doc(safeDocId).get();

            // Compatibility fallback: if a legacy/non-standard document ID is used,
            // find the item by materialCode.
            let itemData = null;

            if (itemDoc.exists) {
                itemData = itemDoc.data() || {};
            } else {
                const fallback = await db.collection('items')
                    .where('materialCode', '==', currentMaterialCode)
                    .limit(1)
                    .get();

                if (!fallback.empty) {
                    itemData = fallback.docs[0].data() || {};
                    safeDocId = fallback.docs[0].id;
                }
            }

            if (!itemData) {
                document.getElementById('display-mat-name').innerText = 'Item Not Found';
                if (showError) {
                    Swal.fire(
                        'Not Found',
                        'මෙම Material Code එකට අදාල දත්ත පද්ධතියේ නොමැත.',
                        'warning'
                    );
                }
                return;
            }

            document.getElementById('display-mat-name').innerText =
                itemData.materialName || itemData.material_name || itemData.name || 'Unnamed Material';

            baseOpeningStock = toNumber(
                itemData.openingStock ??
                itemData.opening_stock ??
                0
            );

            document.getElementById('display-op-stock').innerText = baseOpeningStock;

            const snapshot = await db.collection('transactions')
                .where('materialCode', '==', currentMaterialCode)
                .get();

            const historyContainer = document.getElementById('history-container');
            let runningOpeningStock = baseOpeningStock;

            if (snapshot.empty) {
                historyContainer.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-sm p-8 text-center text-gray-500 border border-gray-100 flex flex-col items-center justify-center">
                        <div class="theme-primary-soft w-16 h-16 rounded-full flex items-center justify-center mb-3">
                            <i class="fas fa-folder-open text-2xl theme-primary-text"></i>
                        </div>
                        <p class="font-medium">කිසිදු දෛනික චලනයක් (Movements) නැත.</p>
                        <p class="text-sm mt-1">දැනට පවතින Closing Stock:
                            <b class="theme-primary-text">${escapeHtml(runningOpeningStock)}</b>
                        </p>
                    </div>
                `;
                return;
            }

            const transactions = [];
            snapshot.forEach(doc => {
                const data = doc.data() || {};
                transactions.push({
                    ...data,
                    date: String(data.date || '').trim()
                });
            });

            transactions.sort((a, b) => {
                const ad = new Date(a.date).getTime();
                const bd = new Date(b.date).getTime();
                if (!Number.isFinite(ad) && !Number.isFinite(bd)) return 0;
                if (!Number.isFinite(ad)) return 1;
                if (!Number.isFinite(bd)) return -1;
                return ad - bd;
            });

            const isMobile = window.innerWidth < 768;
            let htmlContent = '';

            if (isMobile) {
                htmlContent = `<div class="space-y-4">`;

                transactions.forEach(trx => {
                    const r = toNumber(trx.receive);
                    const i = toNumber(trx.issue);
                    const ret = toNumber(trx.return);
                    const opening = runningOpeningStock;
                    const closingStock = opening + r + ret - i;

                    htmlContent += `
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 relative overflow-hidden transition-all hover:shadow-md">
                            <div class="flex justify-between items-center mb-3 border-b border-gray-50 pb-2">
                                <div class="flex items-center gap-2 min-w-0">
                                    <div class="theme-primary-soft theme-primary-text p-1.5 rounded-lg shrink-0">
                                        <i class="fas fa-calendar-day text-xs"></i>
                                    </div>
                                    <span class="font-bold text-gray-800 text-sm truncate">${escapeHtml(trx.date || '-')}</span>
                                </div>
                                <div class="text-right ml-2">
                                    <span class="text-[10px] text-gray-400 font-bold uppercase tracking-wider block">Op. Stock</span>
                                    <span class="font-semibold text-gray-600">${opening}</span>
                                </div>
                            </div>

                            <div class="flex justify-between items-center bg-gray-50 rounded-xl p-3 mb-3">
                                <div class="text-center w-1/3 border-r border-gray-200">
                                    <span class="text-[10px] text-green-600 font-bold uppercase block mb-1">Rec (+)</span>
                                    <span class="font-black text-green-600">${r > 0 ? r : '-'}</span>
                                </div>
                                <div class="text-center w-1/3 border-r border-gray-200">
                                    <span class="text-[10px] text-red-600 font-bold uppercase block mb-1">Iss (-)</span>
                                    <span class="font-black text-red-600">${i > 0 ? i : '-'}</span>
                                </div>
                                <div class="text-center w-1/3">
                                    <span class="text-[10px] text-blue-500 font-bold uppercase block mb-1">Ret (+)</span>
                                    <span class="font-black text-blue-500">${ret > 0 ? ret : '-'}</span>
                                </div>
                            </div>

                            <div class="flex justify-between items-center theme-primary-bg text-white rounded-xl p-3 shadow-inner">
                                <span class="text-xs font-bold uppercase tracking-wider">Closing Stock</span>
                                <span class="text-xl font-black">${closingStock}</span>
                            </div>
                        </div>
                    `;

                    runningOpeningStock = closingStock;
                });

                htmlContent += `</div>`;
            } else {
                htmlContent = `
                    <div class="bg-white rounded-2xl shadow-md overflow-hidden border border-gray-100">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse min-w-[760px]">
                                <thead>
                                    <tr class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider border-b border-gray-200">
                                        <th class="p-4 font-bold">Date</th>
                                        <th class="p-4 font-bold text-right">Op. Stock</th>
                                        <th class="p-4 font-bold text-center text-green-600"><i class="fas fa-arrow-down"></i> Receive</th>
                                        <th class="p-4 font-bold text-center text-red-600"><i class="fas fa-arrow-up"></i> Issue</th>
                                        <th class="p-4 font-bold text-center text-blue-500"><i class="fas fa-undo"></i> Return</th>
                                        <th class="p-4 font-bold text-right text-gray-800 bg-gray-100">Closing Stock</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100 text-sm">
                `;

                transactions.forEach(trx => {
                    const r = toNumber(trx.receive);
                    const i = toNumber(trx.issue);
                    const ret = toNumber(trx.return);
                    const opening = runningOpeningStock;
                    const closingStock = opening + r + ret - i;

                    htmlContent += `
                        <tr class="hover:bg-blue-50/50 transition-colors">
                            <td class="p-4 font-semibold text-gray-800">${escapeHtml(trx.date || '-')}</td>
                            <td class="p-4 text-right font-medium text-gray-500">${opening}</td>
                            <td class="p-4 text-center">
                                ${r > 0 ? `<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full font-bold text-xs">+${r}</span>` : '<span class="text-gray-300">-</span>'}
                            </td>
                            <td class="p-4 text-center">
                                ${i > 0 ? `<span class="bg-red-100 text-red-700 px-3 py-1 rounded-full font-bold text-xs">-${i}</span>` : '<span class="text-gray-300">-</span>'}
                            </td>
                            <td class="p-4 text-center">
                                ${ret > 0 ? `<span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-bold text-xs">+${ret}</span>` : '<span class="text-gray-300">-</span>'}
                            </td>
                            <td class="p-4 text-right font-black theme-primary-text bg-gray-50 border-l border-gray-100 text-base">${closingStock}</td>
                        </tr>
                    `;

                    runningOpeningStock = closingStock;
                });

                htmlContent += `</tbody></table></div></div>`;
            }

            historyContainer.innerHTML = htmlContent;
        } catch (err) {
            console.error('Load Data Error:', err);

            if (showError) {
                if (err.code === 'permission-denied') {
                    Swal.fire('Permission Error', 'ඔබට දත්ත කියවීමට හෝ ලිවීමට අවසර නොමැත.', 'error');
                } else {
                    Swal.fire('Error', 'දත්ත ලබාගැනීමේදී දෝෂයක් සිදු විය.', 'error');
                }
            }
        }
    }

    // ==========================================
    // TRANSACTION MODAL
    // ==========================================
    function openModal() {
        if (!currentMaterialCode) {
            Swal.fire('Warning', 'Valid Material Code එකක් නොමැත.', 'warning');
            return;
        }

        document.getElementById('input-date').value = getLocalDateString();
        document.getElementById('input-receive').value = '';
        document.getElementById('input-issue').value = '';
        document.getElementById('input-return').value = '';

        modal.classList.remove('hidden');

        setTimeout(() => {
            modal.classList.remove('opacity-0');
            modal.classList.add('opacity-100');
            modalContent.classList.remove('translate-y-full', 'md:translate-y-10');
            modalContent.classList.add('translate-y-0');
        }, 10);
    }

    function closeModal() {
        modal.classList.remove('opacity-100');
        modal.classList.add('opacity-0');
        modalContent.classList.remove('translate-y-0');
        modalContent.classList.add('translate-y-full', 'md:translate-y-10');

        setTimeout(() => {
            modal.classList.add('hidden');
        }, 300);
    }

    async function saveTransactionRecord() {
        if (!currentMaterialCode || !safeDocId) {
            Swal.fire('Error', 'Material Code එක හඳුනාගත නොහැක.', 'error');
            return;
        }

        const dateVal = document.getElementById('input-date').value;
        const receiveRaw = document.getElementById('input-receive').value;
        const issueRaw = document.getElementById('input-issue').value;
        const returnRaw = document.getElementById('input-return').value;

        const receiveVal = Number(receiveRaw) || 0;
        const issueVal = Number(issueRaw) || 0;
        const returnVal = Number(returnRaw) || 0;

        if (!dateVal) {
            Swal.fire('Warning', 'කරුණාකර දිනයක් තෝරන්න.', 'warning');
            return;
        }

        if (![receiveVal, issueVal, returnVal].every(Number.isFinite)) {
            Swal.fire('Warning', 'කරුණාකර valid numeric values ඇතුළත් කරන්න.', 'warning');
            return;
        }

        if (receiveVal < 0 || issueVal < 0 || returnVal < 0) {
            Swal.fire('Warning', 'Negative stock values ඇතුළත් කළ නොහැක.', 'warning');
            return;
        }

        if (receiveVal === 0 && issueVal === 0 && returnVal === 0) {
            Swal.fire('Warning', 'අවම වශයෙන් එක් අගයක්වත් ඇතුළත් කරන්න.', 'warning');
            return;
        }

        const docId = `${safeDocId}_${dateVal}`;

        try {
            Swal.fire({
                title: 'Saving...',
                text: 'කරුණාකර රැඳී සිටින්න',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            await db.collection('transactions').doc(docId).set({
                materialCode: currentMaterialCode,
                date: dateVal,
                receive: firebase.firestore.FieldValue.increment(receiveVal),
                issue: firebase.firestore.FieldValue.increment(issueVal),
                return: firebase.firestore.FieldValue.increment(returnVal)
            }, { merge: true });

            closeModal();

            await Swal.fire({
                title: 'සාර්ථකයි!',
                text: 'දත්ත යාවත්කාලීන විය.',
                icon: 'success',
                timer: 1500,
                showConfirmButton: false
            });

            await loadItemBinCard(false);
        } catch (err) {
            console.error('Save Data Error:', err);

            if (err.code === 'permission-denied') {
                Swal.fire('Permission Error', 'ඔබට දත්ත ඇතුළත් කිරීමට අවසර නොමැත.', 'error');
            } else {
                Swal.fire('Error', 'දෝෂයක් සිදු විය: ' + (err.message || err), 'error');
            }
        }
    }

    // ==========================================
    // URL / NAVIGATION
    // ==========================================
    async function loadFromHash() {
        const hash = window.location.hash || '';
        const params = new URLSearchParams(hash.replace(/^#/, ''));
        const token = params.get('item');

        if (!token) {
            currentMaterialCode = '';
            safeDocId = '';
            document.getElementById('display-mat-name').innerText = 'Code Missing!';
            document.getElementById('display-mat-code').innerText = '---';
            return;
        }

        currentMaterialCode = await decryptItemToken(token);
        safeDocId = currentMaterialCode.replace(/\//g, '_');

        if (!currentMaterialCode) {
            document.getElementById('display-mat-name').innerText = 'Invalid Item Link';
            document.getElementById('display-mat-code').innerText = '---';
            Swal.fire('Invalid Link', 'Item URL token එක valid නොවේ.', 'error');
            return;
        }

        await loadItemBinCard();
    }

    // ==========================================
    // EVENT HANDLERS
    // ==========================================
    searchToggle.addEventListener('click', () => toggleSearchBox());
    searchClear.addEventListener('click', clearSearch);

    searchInput.addEventListener('input', () => filterItems(searchInput.value));

    searchInput.addEventListener('keydown', e => {
        if (e.key === 'Escape') toggleSearchBox(false);
    });

    settingsToggle.addEventListener('click', openSettings);
    settingsClose.addEventListener('click', closeSettings);

    settingsModal.addEventListener('click', e => {
        if (e.target === settingsModal) closeSettings();
    });

    document.querySelectorAll('.theme-choice').forEach(btn => {
        btn.addEventListener('click', () => {
            applyTheme(btn.dataset.theme);
        });
    });

    document.getElementById('add-movement-button').addEventListener('click', openModal);
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('save-transaction').addEventListener('click', saveTransactionRecord);

    modal.addEventListener('click', e => {
        if (e.target === modal) closeModal();
    });

    document.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;

        if (!settingsModal.classList.contains('hidden')) closeSettings();
        else if (!searchBox.classList.contains('hidden')) toggleSearchBox(false);
        else if (!modal.classList.contains('hidden')) closeModal();
    });

    window.addEventListener('hashchange', loadFromHash);

    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            if (currentMaterialCode) loadItemBinCard(false);
        }, 250);
    });

    // ==========================================
    // INIT
    // ==========================================
    applyTheme(currentTheme);

    window.addEventListener('DOMContentLoaded', async () => {
        await loadFromHash();
    });
})();
</script>
