<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <title>Item Bin Card - Pro UI</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-soft: #eff6ff;
            --primary-border: #bfdbfe;
            --page-bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --header-from: #1e40af;
            --header-to: #2563eb;
            --ring: rgba(37,99,235,.20);
        }

        html { scroll-behavior: smooth; }
        body {
            background: var(--page-bg);
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
            transition: background-color .25s ease, color .25s ease;
        }

        .theme-header {
            background: linear-gradient(135deg, var(--header-from), var(--header-to)) !important;
        }
        .theme-primary-bg { background-color: var(--primary) !important; }
        .theme-primary-bg:hover { background-color: var(--primary-dark) !important; }
        .theme-primary-text { color: var(--primary) !important; }
        .theme-primary-soft { background-color: var(--primary-soft) !important; }
        .theme-primary-border { border-color: var(--primary-border) !important; }
        .theme-primary-ring:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 4px var(--ring) !important;
        }
        .theme-top-border { border-top-color: var(--primary) !important; }

        .theme-card {
            background: var(--card-bg) !important;
            transition: background-color .25s ease, border-color .25s ease;
        }

        .fade-in {
            animation: fadeIn .45s cubic-bezier(.4,0,.2,1) forwards;
            opacity: 0;
            transform: translateY(10px);
        }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        .delay-1 { animation-delay: .1s; }
        .delay-2 { animation-delay: .2s; }

        .modal-glass {
            background: rgba(255,255,255,.96);
            backdrop-filter: blur(12px);
        }

        .fab-pulse { animation: pulse-ring 2s cubic-bezier(.4,0,.6,1) infinite; }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 var(--ring); }
            70% { box-shadow: 0 0 0 15px transparent; }
            100% { box-shadow: 0 0 0 0 transparent; }
        }

        .search-dropdown {
            max-height: 310px;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .search-result-item { cursor: pointer; }
        .search-result-item:hover { background: var(--primary-soft) !important; }

        .settings-panel {
            max-height: min(80vh, 620px);
            overflow-y: auto;
        }

        .theme-choice {
            border: 2px solid #e5e7eb;
            transition: all .2s ease;
        }
        .theme-choice:hover {
            transform: translateY(-1px);
            border-color: var(--primary-border);
        }
        .theme-choice.active {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--ring);
        }

        .theme-dot {
            width: 34px;
            height: 34px;
            border-radius: 9999px;
            flex: 0 0 auto;
        }

        .theme-ocean { --primary:#2563eb; --primary-dark:#1d4ed8; --primary-soft:#eff6ff; --primary-border:#bfdbfe; --page-bg:#f3f4f6; --header-from:#1e40af; --header-to:#2563eb; --ring:rgba(37,99,235,.20); }
        .theme-emerald { --primary:#059669; --primary-dark:#047857; --primary-soft:#ecfdf5; --primary-border:#a7f3d0; --page-bg:#f1f5f4; --header-from:#065f46; --header-to:#059669; --ring:rgba(5,150,105,.20); }
        .theme-violet { --primary:#7c3aed; --primary-dark:#6d28d9; --primary-soft:#f5f3ff; --primary-border:#ddd6fe; --page-bg:#f5f3f7; --header-from:#5b21b6; --header-to:#7c3aed; --ring:rgba(124,58,237,.20); }
        .theme-rose { --primary:#e11d48; --primary-dark:#be123c; --primary-soft:#fff1f2; --primary-border:#fecdd3; --page-bg:#f7f3f4; --header-from:#9f1239; --header-to:#e11d48; --ring:rgba(225,29,72,.20); }
        .theme-amber { --primary:#d97706; --primary-dark:#b45309; --primary-soft:#fffbeb; --primary-border:#fde68a; --page-bg:#f7f5ef; --header-from:#92400e; --header-to:#d97706; --ring:rgba(217,119,6,.20); }
        .theme-slate { --primary:#475569; --primary-dark:#334155; --primary-soft:#f1f5f9; --primary-border:#cbd5e1; --page-bg:#eef2f6; --header-from:#1e293b; --header-to:#475569; --ring:rgba(71,85,105,.20); }


        /* ================= DARK THEME ================= */
        body.theme-dark {
            --primary:#60a5fa;
            --primary-dark:#3b82f6;
            --primary-soft:#172554;
            --primary-border:#1e40af;
            --page-bg:#0b1120;
            --card-bg:#111827;
            --text:#e5e7eb;
            --muted:#9ca3af;
            --header-from:#020617;
            --header-to:#1e3a8a;
            --ring:rgba(96,165,250,.24);
        }

        body.theme-dark .bg-white,
        body.theme-dark .theme-card,
        body.theme-dark .modal-glass {
            background-color:#111827 !important;
            color:#e5e7eb !important;
        }

        body.theme-dark .bg-white\/80,
        body.theme-dark .bg-white\/50 {
            background-color:rgba(17,24,39,.94) !important;
        }

        body.theme-dark .bg-gray-50 { background-color:#1f2937 !important; }
        body.theme-dark .bg-gray-100 { background-color:#273449 !important; }
        body.theme-dark .bg-gray-200 { background-color:#374151 !important; }

        body.theme-dark .text-gray-900,
        body.theme-dark .text-gray-800,
        body.theme-dark .text-gray-700 {
            color:#f3f4f6 !important;
        }

        body.theme-dark .text-gray-600,
        body.theme-dark .text-gray-500,
        body.theme-dark .text-gray-400 {
            color:#9ca3af !important;
        }

        body.theme-dark .border-gray-100,
        body.theme-dark .border-gray-200,
        body.theme-dark .border-gray-50 {
            border-color:#374151 !important;
        }

        body.theme-dark input,
        body.theme-dark select,
        body.theme-dark textarea {
            background-color:#0f172a !important;
            color:#f3f4f6 !important;
            border-color:#374151 !important;
        }

        body.theme-dark input::placeholder { color:#6b7280 !important; }

        body.theme-dark .divide-gray-100 > :not([hidden]) ~ :not([hidden]) {
            border-color:#374151 !important;
        }

        body.theme-dark .hover\:bg-gray-200:hover { background-color:#374151 !important; }
        body.theme-dark .hover\:bg-blue-50:hover { background-color:#172554 !important; }

        body.theme-dark .search-result-item {
            color:#e5e7eb !important;
            border-color:#374151 !important;
        }

        body.theme-dark .theme-primary-soft {
            background-color:#172554 !important;
        }

        body.theme-dark .theme-primary-border {
            border-color:#1e40af !important;
        }

        body.theme-dark .theme-choice {
            background:#111827;
            color:#f3f4f6;
            border-color:#374151;
        }

        body.theme-dark .theme-choice small {
            color:#9ca3af !important;
        }

        body.theme-dark table thead tr { background-color:#1f2937 !important; }
        body.theme-dark table tbody tr:hover { background-color:#172554 !important; }

        body.theme-dark .settings-panel {
            background:#111827 !important;
        }

        body.theme-dark .settings-panel h3,
        body.theme-dark .settings-panel b {
            color:#f3f4f6 !important;
        }

        body.theme-dark .settings-panel .text-gray-600 {
            color:#d1d5db !important;
        }

        body.theme-dark .search-dropdown {
            scrollbar-color:#4b5563 #111827;
        }

        .settings-backdrop, .search-backdrop { display:none; }
        .settings-backdrop.open, .search-backdrop.open { display:block; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>

<style id="item-performance-ui">
/* Smooth, low-cost UI rendering */
html { scroll-behavior: smooth; }
body { overscroll-behavior-y: contain; }
#history-container { contain: layout paint; }
.search-dropdown { max-height: min(60vh, 520px); overflow-y: auto; overscroll-behavior: contain; }
.search-result-item { content-visibility: auto; contain-intrinsic-size: 64px; }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
.modal-panel, .settings-panel { will-change: transform, opacity; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
.loading-skeleton {
  background: linear-gradient(90deg, rgba(148,163,184,.12), rgba(148,163,184,.22), rgba(148,163,184,.12));
  background-size: 200% 100%;
  animation: itemShimmer 1.2s linear infinite;
}
@keyframes itemShimmer { to { background-position: -200% 0; } }
</style>

</head>

    // ==========================================
    // ITEM URL TOKEN
    // ==========================================
    const ITEM_URL_SECRET = 'BinCard-Item-URL-v2-2026';

    function bytesToBase64Url(bytes) {
        let binary = '';
        bytes.forEach(b => binary += String.fromCharCode(b));
        return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    }

    function base64UrlToBytes(value) {
        const base64 = value.replace(/-/g, '+').replace(/_/g, '/') +
            '='.repeat((4 - value.length % 4) % 4);
        const binary = atob(base64);
        return Uint8Array.from(binary, ch => ch.charCodeAt(0));
    }

    async function getItemCryptoKey() {
        const digest = await crypto.subtle.digest(
            'SHA-256',
            new TextEncoder().encode(ITEM_URL_SECRET)
        );
        return crypto.subtle.importKey(
            'raw',
            digest,
            { name: 'AES-GCM' },
            false,
            ['encrypt', 'decrypt']
        );
    }

    async function createItemToken(materialCode) {
        const key = await getItemCryptoKey();
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ciphertext = await crypto.subtle.encrypt(
            { name: 'AES-GCM', iv },
            key,
            new TextEncoder().encode(String(materialCode || '').trim())
        );
        const combined = new Uint8Array(iv.length + ciphertext.byteLength);
        combined.set(iv, 0);
        combined.set(new Uint8Array(ciphertext), iv.length);
        return bytesToBase64Url(combined);
    }

    async function decryptItemToken(token) {
        try {
            if (!token) return '';
            const payload = base64UrlToBytes(token);
            if (payload.length <= 12) return '';
            const iv = payload.slice(0, 12);
            const ciphertext = payload.slice(12);
            const key = await getItemCryptoKey();
            const plain = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv },
                key,
                ciphertext
            );
            return new TextDecoder().decode(plain).trim();
        } catch (e) {
            console.error('Invalid item URL token:', e);
            return '';
        }
    }

    // ==========================================

    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function normalizeSearchValue(value) {
        return String(value ?? '')
            .normalize('NFKC')
            .toLocaleLowerCase()
            .replace(/[\s_\-\/\\.(),]+/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function compactSearchValue(value) {
        return normalizeSearchValue(value).replace(/\s+/g, '');
    }

    function formatNumber(value) {
        const n = Number(value);
        if (!Number.isFinite(n)) return '0';
        return Number.isInteger(n)
            ? String(n)
            : n.toLocaleString(undefined, { maximumFractionDigits: 3 });
    }

    function getLocalDateString(date = new Date()) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    function toNumber(value) {
        const n = Number(value);
        return Number.isFinite(n) ? n : 0;
    }

    function getItemCode(data, docId = '') {
        const candidates = [
            data?.materialCode,
            data?.material_code,
            data?.materialcode,
            data?.MaterialCode,
            data?.code,
            data?.Code,
            data?.itemCode,
            data?.item_code,
            docId
        ];

        const value = candidates.find(v => v !== undefined && v !== null && String(v).trim() !== '');
        return String(value ?? '').trim();
    }

    function getItemName(data) {
        const candidates = [
            data?.materialName,
            data?.material_name,
            data?.materialname,
            data?.MaterialName,
            data?.name,
            data?.itemName,
            data?.item_name,
            data?.description,
            data?.Description
        ];

        const value = candidates.find(v => v !== undefined && v !== null && String(v).trim() !== '');
        return String(value ?? '-').trim() || '-';
    }

    function searchMatch(item, query) {
        const q = normalizeSearchValue(query);
        const compactQ = compactSearchValue(query);
        if (!q) return false;

        const code = normalizeSearchValue(item.materialCode);
        const name = normalizeSearchValue(item.materialName);
        const compactCode = compactSearchValue(item.materialCode);
        const compactName = compactSearchValue(item.materialName);

        if (code.includes(q) || name.includes(q)) return true;
        if (compactQ && (compactCode.includes(compactQ) || compactName.includes(compactQ))) return true;

        const words = q.split(' ').filter(Boolean);
        return words.length > 1 &&
            words.every(word => code.includes(word) || name.includes(word));
    }

    function searchScore(item, query) {
        const q = normalizeSearchValue(query);
        const code = normalizeSearchValue(item.materialCode);
        const name = normalizeSearchValue(item.materialName);

        if (code === q) return 0;
        if (code.startsWith(q)) return 1;
        if (name === q) return 2;
        if (name.startsWith(q)) return 3;
        if (code.includes(q)) return 4;
        if (name.includes(q)) return 5;
        return 6;
    }

    function applyTheme(themeName) {
        const allowed = ['ocean', 'emerald', 'violet', 'rose', 'amber', 'slate', 'dark'];

        body.className = body.className
            .replace(/\btheme-(ocean|emerald|violet|rose|amber|slate|dark)\b/g, '')
            .trim();

        body.classList.add(`theme-${theme}`);

        currentTheme = theme;
        localStorage.setItem('binCardTheme', theme);

        document.querySelectorAll('.theme-choice').forEach(btn => {
            const active = btn.dataset.theme === theme;
            btn.classList.toggle('active', active);
            btn.setAttribute('aria-pressed', active ? 'true' : 'false');
        });

        const metaTheme = document.querySelector('meta[name="theme-color"]');
        const colors = {
            ocean: '#2563eb',
            emerald: '#059669',
            violet: '#7c3aed',
            rose: '#e11d48',

    function toggleSearchBox(force) {
        const shouldOpen = typeof force === 'boolean'
            ? force
            : searchBox.classList.contains('hidden');

        if (shouldOpen) {
            searchBox.classList.remove('hidden');
            searchToggle.setAttribute('aria-expanded', 'true');

            setTimeout(() => {
                searchInput.focus();
                searchInput.select();
            }, 20);

            // Do not hit Firestore just by opening the search UI.
            // Data is loaded only when the user actually types a query.
            if (normalizeSearchValue(searchInput.value)) filterItems(searchInput.value);
        } else {
            searchBox.classList.add('hidden');
            searchToggle.setAttribute('aria-expanded', 'false');
            searchResults.classList.add('hidden');
            searchStatus.classList.add('hidden');
        }
    }

    async function loadItemsForSearch(force = false) {
        if (!force && allItemsCache.length) return allItemsCache;
        if (!force && searchLoadPromise) return searchLoadPromise;

        searchStatus.textContent = 'අයිතම ලැයිස්තුව ලබාගනිමින්...';
        searchStatus.classList.remove('hidden');

        searchLoadPromise = (async () => {
            try {
                const snapshot = await db.collection('items').get();
                const items = [];

                snapshot.forEach(doc => {
                    const data = doc.data() || {};
                    const materialCode = getItemCode(data, doc.id);
                    const materialName = getItemName(data);

                    if (!materialCode) return;

                    items.push({
                        id: doc.id,
                        materialCode,
                        materialName
                    });
                });

                items.sort((a, b) =>
                    a.materialCode.localeCompare(
                        b.materialCode,
                        undefined,
                        { numeric: true, sensitivity: 'base' }
                    )
                );

                allItemsCache = items;
                searchStatus.textContent = `${items.length} items loaded`;
                return items;
            } catch (e) {
                console.error('Error fetching items for search:', e);
                allItemsCache = [];
                searchStatus.textContent = 'Search data ලබාගැනීමට නොහැකි විය.';
                throw e;
            } finally {
                searchLoadPromise = null;
            }
        })();

        return searchLoadPromise;
    }

    async function filterItems(query) {
        const requestId = ++searchRequestId;
        const q = normalizeSearchValue(query);

        if (!q) {
            searchResults.innerHTML = '';
            searchResults.classList.add('hidden');
            searchStatus.classList.add('hidden');
            return;
        }

        searchResults.classList.remove('hidden');
        searchResults.innerHTML = `
            <div class="p-4 text-center text-gray-400 text-xs">
                <i class="fas fa-spinner fa-spin mr-1"></i> Searching...
            </div>
        `;

        try {
            const items = await loadItemsForSearch();

            if (requestId !== searchRequestId || q !== normalizeSearchValue(searchInput.value)) return;

            const filtered = items
                .filter(item => searchMatch(item, q))
                .sort((a, b) => {
                    const scoreDiff = searchScore(a, q) - searchScore(b, q);
                    if (scoreDiff !== 0) return scoreDiff;
                    return a.materialCode.localeCompare(
                        b.materialCode,
                        undefined,
                        { numeric: true, sensitivity: 'base' }
                    );
                })
                .slice(0, 50);

            searchStatus.textContent = filtered.length
                ? `${filtered.length}${items.length > 50 ? '+' : ''} results`
                : '0 results';
            searchStatus.classList.remove('hidden');

            if (!filtered.length) {
                searchResults.innerHTML = `
                    <div class="p-5 text-center text-xs text-gray-400">
                        <i class="fas fa-box-open mb-2 block text-lg"></i>
                        <p class="font-semibold">අයිතම හමු නොවීය</p>
                        <p class="mt-1">Material Code හෝ Material Name එකෙන් නැවත සොයන්න.</p>
                    </div>
                `;
                return;
            }

            const currentUrl = `${window.location.origin}${window.location.pathname}${window.location.search}`;

            const rows = await Promise.all(filtered.map(async item => {
                let token = itemTokenCache.get(item.materialCode);
                if (!token) {
                    token = await createItemToken(item.materialCode);
                    itemTokenCache.set(item.materialCode, token);
                }
                const link = `${currentUrl}#item=${encodeURIComponent(token)}`;

                return `
                    <a href="${escapeHtml(link)}"
                       class="search-result-item block p-3 transition rounded-lg"
                       data-material-code="${escapeHtml(item.materialCode)}">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-lg theme-primary-soft theme-primary-text flex items-center justify-center shrink-0">
                                <i class="fas fa-box"></i>
                            </div>
                            <div class="min-w-0 flex-1">
                                <p class="font-bold text-sm theme-primary-text truncate">${escapeHtml(item.materialCode)}</p>
                                <p class="text-xs text-gray-600 truncate">${escapeHtml(item.materialName)}</p>
                            </div>
                            <i class="fas fa-chevron-right ml-auto text-xs text-gray-300"></i>
                        </div>
                    </a>
                `;
            }));

            if (requestId !== searchRequestId || q !== normalizeSearchValue(searchInput.value)) return;

            searchResults.innerHTML = rows.join('');
            searchResults.classList.remove('hidden');
        } catch (e) {
            if (requestId !== searchRequestId) return;

            console.error('Search error:', e);
            searchStatus.textContent = 'Search failed';
            searchResults.innerHTML = `
                <div class="p-4 text-center text-xs text-red-400">
                    Search එකේදී දෝෂයක් ඇතිවිය. නැවත උත්සාහ කරන්න.
                </div>
            `;
            searchResults.classList.remove('hidden');
        }
    }

    function renderHistory(transactions) {
        const historyContainer = document.getElementById('history-container');
        if (!historyContainer) return;

        const rows = [...transactions].sort((a, b) => String(a.date).localeCompare(String(b.date)));
        let runningOpeningStock = Number(baseOpeningStock) || 0;

        if (!rows.length) {
            historyContainer.innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm p-8 text-center text-gray-500 border border-gray-100">
                    <div class="bg-gray-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3">
                        <i class="fas fa-folder-open text-2xl text-gray-300"></i>
                    </div>
                    <p class="font-medium">කිසිදු දෛනික චලනයක් (Movements) නැත.</p>
                </div>`;
            return;
        }

        const normalized = rows.map(item => {
            const receive = toNumber(item.receive);
            const issue = toNumber(item.issue);
            const returnQty = toNumber(item.return);
            const opening = runningOpeningStock;
            const closing = opening + receive + returnQty - issue;
            runningOpeningStock = closing;
            return { ...item, receive, issue, returnQty, opening, closing };
        });

        const finalStock = normalized[normalized.length - 1]?.closing ?? baseOpeningStock;
        const finalStockEl = document.getElementById('display-current-stock');
        if (finalStockEl) finalStockEl.innerText = formatNumber(finalStock);

        const mobileHtml = normalized.slice().reverse().map(item => `
            <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 mb-3">
                <div class="flex items-center justify-between mb-3">
                    <div>
                        <p class="font-bold text-sm">${escapeHtml(item.date || '-')}</p>
                        <p class="text-[11px] text-gray-400">Opening: ${formatNumber(item.opening)}</p>
                    </div>
                    <span class="px-2.5 py-1 rounded-full text-[11px] font-bold theme-primary-soft theme-primary-text">
                        Closing ${formatNumber(item.closing)}
                    </span>
                </div>
                <div class="grid grid-cols-3 gap-2 text-center">
                    <div class="rounded-xl bg-emerald-50 p-2">
                        <p class="text-[10px] text-emerald-600 font-semibold">Receive</p>
                        <p class="font-bold text-emerald-700">${formatNumber(item.receive)}</p>
                    </div>
                    <div class="rounded-xl bg-red-50 p-2">
                        <p class="text-[10px] text-red-600 font-semibold">Issue</p>
                        <p class="font-bold text-red-700">${formatNumber(item.issue)}</p>
                    </div>
                    <div class="rounded-xl bg-amber-50 p-2">
                        <p class="text-[10px] text-amber-600 font-semibold">Return</p>
                        <p class="font-bold text-amber-700">${formatNumber(item.returnQty)}</p>
                    </div>
                </div>
            </div>
        `).join('');

        const desktopRows = normalized.map(item => `
            <tr class="border-b border-gray-100 last:border-0">
                <td class="px-4 py-3 font-medium">${escapeHtml(item.date || '-')}</td>
                <td class="px-4 py-3 text-right">${formatNumber(item.opening)}</td>
                <td class="px-4 py-3 text-right text-emerald-600 font-semibold">${formatNumber(item.receive)}</td>
                <td class="px-4 py-3 text-right text-red-600 font-semibold">${formatNumber(item.issue)}</td>
                <td class="px-4 py-3 text-right text-amber-600 font-semibold">${formatNumber(item.returnQty)}</td>
                <td class="px-4 py-3 text-right font-bold theme-primary-text">${formatNumber(item.closing)}</td>
            </tr>
        `).join('');

        const mobileTarget = document.getElementById('mobile-history');
        const desktopTarget = document.getElementById('desktop-history-body');

        if (mobileTarget) mobileTarget.innerHTML = mobileHtml;
        if (desktopTarget) desktopTarget.innerHTML = desktopRows;
    }

    async function loadItemBinCard(showError = true, force = false) {
        const requestId = ++binCardRequestId;

        if (!currentMaterialCode) {
            document.getElementById('display-mat-name').innerText = 'Code Missing!';
            document.getElementById('display-mat-code').innerText = '---';
            return;
        }

        document.getElementById('display-mat-code').innerText = currentMaterialCode;

        try {
            // Reuse already-loaded item data unless this is an explicit refresh.
            let itemData = currentItemData;
            let itemDocId = safeDocId;

            if (!itemData || force) {
                const itemDoc = await db.collection('items').doc(safeDocId).get();

                if (itemDoc.exists) {
                    itemData = itemDoc.data() || {};
                    itemDocId = itemDoc.id;
                } else {
                    const querySnap = await db.collection('items')
                        .where('materialCode', '==', currentMaterialCode)
                        .limit(1)
                        .get();

                    if (!querySnap.empty) {
                        const fallback = querySnap.docs[0];
                        itemData = fallback.data() || {};
                        itemDocId = fallback.id;
                    } else {
                        // Support older imported Excel schemas without downloading the whole collection.
                        const legacyFields = ['material_code', 'materialcode', 'MaterialCode', 'code', 'Code', 'itemCode', 'item_code'];
                        for (const field of legacyFields) {
                            const legacySnap = await db.collection('items')
                                .where(field, '==', currentMaterialCode)
                                .limit(1)
                                .get();
                            if (!legacySnap.empty) {
                                const fallback = legacySnap.docs[0];
                                itemData = fallback.data() || {};
                                itemDocId = fallback.id;
                                break;
                            }
                        }
                    }
                }

                if (!itemData) {
                    document.getElementById('display-mat-name').innerText = 'Item Not Found';
                    if (showError) {
                        Swal.fire('Not Found', 'මෙම Material Code එකට අදාල දත්ත පද්ධතියේ නොමැත.', 'warning');
                    }
                    return;
                }

                currentItemData = itemData;
                safeDocId = itemDocId;
            }

            // Always keep the displayed/requested code stable; transactions use this exact code.

            if (requestId !== binCardRequestId) return;

            document.getElementById('display-mat-name').innerText =
                getItemName(itemData) || 'Unnamed Material';

            baseOpeningStock = toNumber(itemData.openingStock);
            document.getElementById('display-op-stock').innerText = formatNumber(baseOpeningStock);

            // One transaction query only.
            const snapshot = await db.collection('transactions')
                .where('materialCode', '==', currentMaterialCode)
                .get();

            if (requestId !== binCardRequestId) return;

            currentTransactions = snapshot.docs
                .map(doc => ({ id: doc.id, ...(doc.data() || {}) }))
                .filter(t => t.date)
                .sort((a, b) => String(a.date).localeCompare(String(b.date)));

            // Render after the browser gets a frame, keeping interaction smooth.
            cancelAnimationFrame(historyRenderFrame);
            historyRenderFrame = requestAnimationFrame(() => {
                if (requestId === binCardRequestId) renderHistory(currentTransactions);
            });

        } catch (err) {
            console.error('loadItemBinCard:', err);
            if (showError) {
                Swal.fire('Error', 'දත්ත ලබාගැනීමේදී දෝෂයක් ඇතිවිය.', 'error');
            }
        }
    }

    async function saveTransactionRecord() {
        if (isSavingTransaction) return;

        if (!currentMaterialCode || !safeDocId) {
            Swal.fire('Error', 'Material Code එක හඳුනාගත නොහැක.', 'error');
            return;
        }

        const dateVal = document.getElementById('input-date').value;
        const receiveRaw = document.getElementById('input-receive').value;
        const issueRaw = document.getElementById('input-issue').value;
        const returnRaw = document.getElementById('input-return').value;

        const receiveVal = receiveRaw === '' ? 0 : Number(receiveRaw);
        const issueVal = issueRaw === '' ? 0 : Number(issueRaw);
        const returnVal = returnRaw === '' ? 0 : Number(returnRaw);

        if (!dateVal) {
            Swal.fire('Warning', 'කරුණාකර දිනයක් තෝරන්න.', 'warning');
            return;
        }

        if (![receiveVal, issueVal, returnVal].every(Number.isFinite)) {
            Swal.fire('Warning', 'කරුණාකර valid numeric values ඇතුළත් කරන්න.', 'warning');
            return;
        }

        if (receiveVal < 0 || issueVal < 0 || returnVal < 0) {
            Swal.fire('Warning', 'Negative stock values ඇතුළත් කළ නොහැක.', 'warning');
            return;
        }

        if (receiveVal === 0 && issueVal === 0 && returnVal === 0) {
            Swal.fire('Warning', 'අවම වශයෙන් එක් අගයක්වත් ඇතුළත් කරන්න.', 'warning');
            return;
        }

        const docId = `${safeDocId}_${dateVal}`;

        isSavingTransaction = true;
        const saveButton = document.getElementById('save-transaction');
        if (saveButton) saveButton.disabled = true;

        try {
            Swal.fire({
                title: 'Saving...',
                text: 'කරුණාකර රැඳී සිටින්න',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            await db.collection('transactions').doc(docId).set({
                materialCode: currentMaterialCode,
                date: dateVal,
                receive: firebase.firestore.FieldValue.increment(receiveVal),
                issue: firebase.firestore.FieldValue.increment(issueVal),
                return: firebase.firestore.FieldValue.increment(returnVal)
            }, { merge: true });

            closeModal();

            await Swal.fire({
                title: 'සාර්ථකයි!',
                text: 'දත්ත යාවත්කාලීන විය.',
                icon: 'success',
                timer: 1500,
                showConfirmButton: false
            });

            await loadItemBinCard(false, true);
        } catch (err) {
            console.error('Save Data Error:', err);

            if (err.code === 'permission-denied') {
                Swal.fire('Permission Error', 'ඔබට දත්ත ඇතුළත් කිරීමට අවසර නොමැත.', 'error');
            } else {
                Swal.fire('Error', 'දෝෂයක් සිදු විය: ' + (err.message || err), 'error');
            }
        } finally {
            isSavingTransaction = false;
            if (saveButton) saveButton.disabled = false;
        }
    }

    // ==========================================
    // URL / NAVIGATION
    // ==========================================
    function showInitialLoadingState() {
        const name = document.getElementById('display-mat-name');
        const code = document.getElementById('display-mat-code');
        const history = document.getElementById('history-container');

        if (name) name.innerHTML = '<span class="inline-block h-4 w-44 rounded loading-skeleton align-middle"></span>';
        if (code) code.innerHTML = '<span class="inline-block h-4 w-28 rounded loading-skeleton align-middle"></span>';
        if (history) {
            history.innerHTML = `
                <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 space-y-3">
                    <div class="h-4 w-32 rounded loading-skeleton"></div>
                    <div class="h-10 w-full rounded-xl loading-skeleton"></div>
                    <div class="h-10 w-full rounded-xl loading-skeleton"></div>
                </div>`;
        }
    }

    async function loadFromHash() {
        const hash = window.location.hash || '';
        const params = new URLSearchParams(hash.replace(/^#/, ''));
        const token = params.get('item');

        if (!token) {
            currentMaterialCode = '';
            safeDocId = '';
            document.getElementById('display-mat-name').innerText = 'Code Missing!';
            document.getElementById('display-mat-code').innerText = '---';
            return;
        }

        binCardRequestId++;
        cancelAnimationFrame(historyRenderFrame);
        currentItemData = null;
        currentTransactions = [];
        showInitialLoadingState();
        currentMaterialCode = await decryptItemToken(token);
        safeDocId = currentMaterialCode.replace(/\//g, '_');
        if (!currentMaterialCode) {
            document.getElementById('display-mat-name').innerText = 'Invalid Item Link';
            document.getElementById('display-mat-code').innerText = '---';
            Swal.fire('Invalid Link', 'Item URL token එක valid නොවේ.', 'error');
            return;
        }

        await loadItemBinCard();
    }

    // ==========================================
    // EVENT HANDLERS
    // ==========================================
    searchToggle.addEventListener('click', () => toggleSearchBox());
    searchClear.addEventListener('click', clearSearch);

    searchInput.addEventListener('input', () => filterItems(searchInput.value));

    searchResults.addEventListener('click', e => {
        const link = e.target.closest('a[data-material-code]');
        if (!link) return;
        searchRequestId++;
        searchBox.classList.add('hidden');
        searchToggle.setAttribute('aria-expanded', 'false');
        searchResults.classList.add('hidden');
    });

    searchInput.addEventListener('keydown', e => {
        if (e.key === 'Escape') toggleSearchBox(false);
    });

    settingsToggle.addEventListener('click', openSettings);
    settingsClose.addEventListener('click', closeSettings);

    settingsModal.addEventListener('click', e => {
        if (e.target === settingsModal) closeSettings();
    });

    document.querySelectorAll('.theme-choice').forEach(btn => {
        btn.addEventListener('click', () => {
            applyTheme(btn.dataset.theme);
        });
    });

    document.getElementById('add-movement-button').addEventListener('click', openModal);
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('save-transaction').addEventListener('click', saveTransactionRecord);

    modal.addEventListener('click', e => {
        if (e.target === modal) closeModal();
    });

    document.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;

        if (!settingsModal.classList.contains('hidden')) closeSettings();
        else if (!searchBox.classList.contains('hidden')) toggleSearchBox(false);
        else if (!modal.classList.contains('hidden')) closeModal();
    });

    window.addEventListener('hashchange', loadFromHash);

    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            // Layout is CSS-driven; no Firebase reload is necessary on resize.
            document.documentElement.style.setProperty('--viewport-width', `${window.innerWidth}px`);
        }, 120);
    });

    // ==========================================
    // INIT
    // ==========================================
    applyTheme(currentTheme);

    window.addEventListener('DOMContentLoaded', async () => {
        await loadFromHash();
    });
})();
</script>
</body>
</html>
