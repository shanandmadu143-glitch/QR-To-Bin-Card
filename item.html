<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Item Bin Card - Pro UI</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Custom Styles -->
    <style>
        body { background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        
        .fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .search-dropdown {
            max-height: 250px;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .modal-glass {
            background: rgba(255, 255, 255, 0.98);
        }
    </style>
</head>
<body class="font-sans text-gray-800 antialiased selection:bg-blue-200">

    <!-- Top Navigation Header -->
    <header class="bg-gradient-to-r from-blue-800 to-blue-600 text-white shadow-lg sticky top-0 z-40">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center relative">
            <h1 class="text-lg md:text-xl font-bold flex items-center gap-2 tracking-wide">
                <i class="fas fa-layer-group text-blue-200"></i> Bin Card
            </h1>
            
            <div class="flex items-center gap-2">
                <!-- Search Icon Toggle Button -->
                <button onclick="toggleSearchBox()" class="bg-white/20 hover:bg-white/30 text-white w-9 h-9 rounded-full flex items-center justify-center transition shadow-sm" title="Search Item">
                    <i class="fas fa-search text-sm"></i>
                </button>
            </div>

            <!-- Floating Search Dropdown Box (Hidden by default) -->
            <div id="search-box-container" class="absolute top-14 right-4 left-4 bg-white rounded-xl shadow-2xl border border-gray-100 p-3 hidden z-50 fade-in text-gray-800">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                        <i class="fas fa-search"></i>
                    </span>
                    <input type="text" id="search-input" oninput="filterItems(this.value)" placeholder="Search by Material Code or Name..." class="w-full bg-gray-50 border border-gray-200 rounded-lg pl-10 pr-10 py-2.5 text-sm focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none transition font-medium">
                    <button onclick="toggleSearchBox()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <!-- Search Results List -->
                <div id="search-results" class="search-dropdown mt-2 divide-y divide-gray-100 hidden">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 max-w-4xl pb-24 pt-6">
        
        <!-- Hero Details Card -->
        <div class="bg-white rounded-2xl shadow-xl p-5 md:p-8 mb-8 relative border-t-4 border-blue-500 fade-in overflow-hidden">
            <div class="absolute -right-10 -top-10 text-blue-50 opacity-50 pointer-events-none">
                <i class="fas fa-box-open" style="font-size: 150px;"></i>
            </div>
            
            <div class="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                <div>
                    <div class="inline-flex items-center gap-1.5 bg-blue-50 text-blue-700 text-xs font-bold uppercase tracking-widest px-3 py-1 rounded-full mb-3 shadow-sm border border-blue-100">
                        <i class="fas fa-tag"></i> Material Info
                    </div>
                    <h2 class="text-2xl md:text-3xl font-extrabold text-gray-900 leading-tight" id="display-mat-name">Loading...</h2>
                    <div class="mt-2 flex items-center gap-2 text-gray-500 bg-gray-50 inline-block px-3 py-1.5 rounded-lg border">
                        <i class="fas fa-barcode"></i> 
                        <span class="font-mono font-bold text-gray-700" id="display-mat-code">---</span>
                    </div>
                </div>
                
                <div class="bg-gradient-to-br from-green-50 to-green-100 border border-green-200 rounded-2xl p-4 text-center md:text-right min-w-[160px] shadow-sm transform hover:scale-105 transition duration-300">
                    <div class="flex items-center justify-center md:justify-end gap-2 mb-1">
                        <p class="text-xs text-green-700 font-bold uppercase tracking-wider">Base Op. Stock</p>
                        <button type="button" onclick="editBaseOpeningStock()" class="w-7 h-7 rounded-full bg-white/80 hover:bg-white text-green-700 hover:text-green-900 flex items-center justify-center shadow-sm transition active:scale-90" title="Edit Base Op. Stock" aria-label="Edit Base Op. Stock">
                            <i class="fas fa-pen text-[10px]"></i>
                        </button>
                    </div>
                    <p class="text-3xl md:text-4xl font-black text-green-800" id="display-op-stock">0</p>
                </div>
            </div>
        </div>

        <!-- History Section Title -->
        <div class="flex items-center gap-3 mb-4 px-1 fade-in">
            <div class="h-8 w-1 bg-yellow-400 rounded-full"></div>
            <h3 class="text-lg md:text-xl font-bold text-gray-800 flex items-center gap-2">
                <i class="fas fa-history text-gray-400"></i> Movement History
            </h3>
        </div>

        <!-- History Container -->
        <div id="history-container" class="fade-in">
            <div class="bg-white rounded-2xl shadow-md p-8 text-center text-gray-400 border border-gray-100">
                <i class="fas fa-spinner fa-spin text-3xl mb-3 text-blue-500"></i>
                <p>Loading records...</p>
            </div>
        </div>

    </main>

    <!-- Floating Action Button (FAB) -->
    <button onclick="openModal()" 
        class="fixed bottom-6 right-6 md:bottom-10 md:right-10 bg-blue-600 hover:bg-blue-700 text-white rounded-full w-14 h-14 md:w-16 md:h-16 flex items-center justify-center shadow-2xl transition transform hover:scale-110 active:scale-95 z-40"
        title="Add Movement">
        <i class="fas fa-plus text-2xl"></i>
    </button>

    <!-- Modern Glass Modal -->
    <div id="transaction-modal" class="fixed inset-0 bg-gray-900/40 hidden flex items-end md:items-center justify-center z-50 transition-opacity duration-200 opacity-0">
        <div class="modal-glass w-full max-w-md rounded-t-3xl md:rounded-2xl shadow-2xl overflow-hidden transform translate-y-full md:translate-y-10 transition-transform duration-200" id="modal-content">
            
            <div class="px-6 py-4 border-b flex justify-between items-center bg-white">
                <h3 class="font-bold text-lg text-gray-800 flex items-center gap-2">
                    <div class="bg-blue-100 text-blue-600 p-2 rounded-lg"><i class="fas fa-pen"></i></div>
                    Update Stock
                </h3>
                <button onclick="closeModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-500 rounded-full w-8 h-8 flex items-center justify-center transition">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="p-6 bg-white">
                <div class="mb-5">
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Select Date</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                            <i class="fas fa-calendar-alt"></i>
                        </div>
                        <input type="date" id="input-date" class="w-full border-2 border-gray-200 rounded-xl pl-10 p-3 text-sm font-semibold focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 outline-none transition bg-white shadow-sm">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3 mb-6">
                    <div class="bg-green-50 p-3 rounded-xl border border-green-100 text-center">
                        <label class="block text-[10px] font-bold text-green-700 uppercase tracking-wide mb-1"><i class="fas fa-arrow-down mb-1 text-sm block"></i> Receive</label>
                        <input type="number" id="input-receive" min="0" placeholder="0" class="w-full bg-white border border-green-200 rounded-lg p-2 text-center font-bold text-green-700 focus:outline-none focus:border-green-500 shadow-inner">
                    </div>
                    <div class="bg-red-50 p-3 rounded-xl border border-red-100 text-center">
                        <label class="block text-[10px] font-bold text-red-700 uppercase tracking-wide mb-1"><i class="fas fa-arrow-up mb-1 text-sm block"></i> Issue</label>
                        <input type="number" id="input-issue" min="0" placeholder="0" class="w-full bg-white border border-red-200 rounded-lg p-2 text-center font-bold text-red-700 focus:outline-none focus:border-red-500 shadow-inner">
                    </div>
                    <div class="bg-blue-50 p-3 rounded-xl border border-blue-100 text-center">
                        <label class="block text-[10px] font-bold text-blue-700 uppercase tracking-wide mb-1"><i class="fas fa-undo mb-1 text-sm block"></i> Return</label>
                        <input type="number" id="input-return" min="0" placeholder="0" class="w-full bg-white border border-blue-200 rounded-lg p-2 text-center font-bold text-blue-700 focus:outline-none focus:border-blue-500 shadow-inner">
                    </div>
                </div>

                <button onclick="saveTransactionRecord()" class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg shadow-blue-500/30 flex justify-center items-center gap-2 transform active:scale-95">
                    <i class="fas fa-check-circle"></i> Save Movement
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // FIREBASE CONFIGURATION
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDUbL9Q28whHtrJ1Q-J1HzFO-ybQa11y0U",
            authDomain: "qr-to-bin-card.firebaseapp.com",
            projectId: "qr-to-bin-card",
            storageBucket: "qr-to-bin-card.firebasestorage.app",
            messagingSenderId: "64518992022",
            appId: "1:64518992022:web:4e55b994b91765064ad2b7",
            measurementId: "G-9PHQBG7F88"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Enable offline persistence for instant UI rendering
        db.enablePersistence({ synchronizeTabs: true }).catch(err => {
            console.warn("Firestore persistence notice:", err.code);
        });

        const urlParams = new URLSearchParams(window.location.search);
        const rawCode = urlParams.get('code');
        const currentMaterialCode = rawCode ? rawCode.trim() : "";
        const safeDocId = currentMaterialCode.replace(/\//g, '_'); 

        let baseOpeningStock = 0;
        let allItemsCache = []; // Cache for quick search
        let cachedTransactions = []; // Memory cache to prevent re-fetching on resize
        let isSearchFetching = false;

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // Toggle Search Box
        function toggleSearchBox() {
            const box = document.getElementById('search-box-container');
            const input = document.getElementById('search-input');
            const resultsDiv = document.getElementById('search-results');

            if (box.classList.contains('hidden')) {
                box.classList.remove('hidden');
                input.focus();

                // Load the search data first. If the user has already typed,
                // run the search again after Firestore data is ready.
                fetchAllItemsForSearch().then(() => {
                    if (!box.classList.contains('hidden') && input.value.trim()) {
                        filterItems(input.value);
                    }
                });
            } else {
                box.classList.add('hidden');
                resultsDiv.classList.add('hidden');
                resultsDiv.innerHTML = '';
            }
        }

        // Fetch items once for fast search.
        // Always return the same promise while a request is in progress so
        // multiple quick calls cannot start duplicate Firestore reads.
        let searchFetchPromise = null;

        async function fetchAllItemsForSearch() {
            if (allItemsCache.length > 0) return allItemsCache;
            if (searchFetchPromise) return searchFetchPromise;

            isSearchFetching = true;
            searchFetchPromise = db.collection('items').get()
                .then(snapshot => {
                    allItemsCache = [];
                    snapshot.forEach(doc => {
                        const data = doc.data() || {};

                        // Keep the Firestore document id as a fallback.
                        // This helps when older records do not contain
                        // materialCode as a field.
                        allItemsCache.push({
                            ...data,
                            _docId: doc.id
                        });
                    });
                    return allItemsCache;
                })
                .catch(e => {
                    console.error("Error fetching items for search:", e);
                    allItemsCache = [];
                    throw e;
                })
                .finally(() => {
                    isSearchFetching = false;
                    searchFetchPromise = null;
                });

            return searchFetchPromise;
        }

        // Dynamic filtering for search
        async function filterItems(query) {
            const resultsDiv = document.getElementById('search-results');
            const q = String(query || '').toLocaleLowerCase().trim();

            if (!q) {
                resultsDiv.classList.add('hidden');
                resultsDiv.innerHTML = '';
                return;
            }

            // Prevent the first keystrokes from searching an empty cache.
            if (allItemsCache.length === 0) {
                try {
                    await fetchAllItemsForSearch();
                } catch (e) {
                    resultsDiv.innerHTML = `
                        <div class="p-3 text-center text-xs text-red-500">
                            Search data ලබාගැනීමට නොහැකි විය. නැවත උත්සාහ කරන්න.
                        </div>`;
                    resultsDiv.classList.remove('hidden');
                    return;
                }

                // Ignore an old async response if the input changed.
                const latestQuery = document.getElementById('search-input').value;
                if (String(latestQuery).trim() !== String(query).trim()) {
                    return;
                }
            }

            const filtered = allItemsCache.filter(item => {
                const code = String(item.materialCode ?? item.code ?? item._docId ?? '')
                    .toLocaleLowerCase()
                    .trim();
                const name = String(item.materialName ?? item.name ?? '')
                    .toLocaleLowerCase()
                    .trim();

                return code.includes(q) || name.includes(q);
            });

            if (filtered.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="p-3 text-center text-xs text-gray-400">
                        අයිතම හමු නොවීය
                    </div>`;
                resultsDiv.classList.remove('hidden');
                return;
            }

            // Show a reasonable number of matches to keep the dropdown fast.
            const visibleResults = filtered.slice(0, 50);
            const currentUrl = window.location.href.split('?')[0];

            let html = '';
            visibleResults.forEach(item => {
                const materialCode = String(item.materialCode ?? item.code ?? item._docId ?? '');
                const materialName = String(item.materialName ?? item.name ?? '-');

                // Do not create a broken "?code=" link for records with no code.
                const link = materialCode
                    ? `${currentUrl}?code=${encodeURIComponent(materialCode)}`
                    : '#';

                html += `
                    <a href="${link}" class="block p-2.5 hover:bg-blue-50 transition rounded-lg"
                       ${materialCode ? '' : 'onclick="return false;"'}>
                        <p class="font-bold text-sm text-blue-700">${escapeHtml(materialCode)}</p>
                        <p class="text-xs text-gray-600 truncate">${escapeHtml(materialName)}</p>
                    </a>
                `;
            });

            if (filtered.length > visibleResults.length) {
                html += `
                    <div class="p-2 text-center text-[11px] text-gray-400 border-t">
                        ${filtered.length - visibleResults.length} more results...
                    </div>`;
            }

            resultsDiv.innerHTML = html;
            resultsDiv.classList.remove('hidden');
        }

        async function loadItemBinCard() {
            if (!currentMaterialCode) {
                Swal.fire('Error', 'Material Code එකක් ලබාදී නොමැත. කරුණාකර Admin Panel හරහා හෝ QR Code එක scan කර පිවිසෙන්න.', 'error');
                document.getElementById('display-mat-name').innerText = "Code Missing!";
                return;
            }

            document.getElementById('display-mat-code').innerText = currentMaterialCode;

            try {
                // Execute queries in parallel for ultra-fast loading
                const [itemDoc, snapshot] = await Promise.all([
                    db.collection('items').doc(safeDocId).get(),
                    db.collection('transactions').where('materialCode', '==', currentMaterialCode).get()
                ]);

                if (!itemDoc.exists) {
                    document.getElementById('display-mat-name').innerText = "Item Not Found";
                    Swal.fire('Not Found', 'මෙම Material Code එකට අදාල දත්ත පද්ධතියේ නොමැත.', 'warning');
                    return;
                }

                const itemData = itemDoc.data();
                document.getElementById('display-mat-name').innerText = itemData.materialName || 'Unnamed Material';
                baseOpeningStock = itemData.openingStock !== undefined ? Number(itemData.openingStock) : 0;
                document.getElementById('display-op-stock').innerText = baseOpeningStock;

                cachedTransactions = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    cachedTransactions.push({ ...data, __docId: doc.id });
                });
                
                // Fast string comparison sorting YYYY-MM-DD
                cachedTransactions.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

                renderHistoryTable();

            } catch (err) {
                console.error("Load Data Error:", err);
                if (err.code === 'permission-denied') {
                    Swal.fire('Permission Error', 'ඔබට දත්ත කියවීමට හෝ ලිවීමට අවසර නොමැත.', 'error');
                } else {
                    Swal.fire('Error', 'දත්ත ලබාගැනීමේදී දෝෂයක් සිදු විය.', 'error');
                }
            }
        }

        function renderHistoryTable() {
            const historyContainer = document.getElementById('history-container');
            let runningOpeningStock = baseOpeningStock;

            // Calculate stock chronologically, while displaying newest dates first.
            const stockByDate = {};
            let chronologicalStock = baseOpeningStock;
            [...cachedTransactions].sort((a, b) => (a.date || '').localeCompare(b.date || '')).forEach(trx => {
                const r = Number(trx.receive || 0);
                const i = Number(trx.issue || 0);
                const ret = Number(trx.return || 0);

                // If an Op. Stock was manually edited for this date, use that value
                // as the opening stock for this date. Every later date then naturally
                // starts from this date's recalculated closing stock.
                const hasOverride = trx.openingStockOverride !== undefined && trx.openingStockOverride !== null && trx.openingStockOverride !== '';
                const opening = hasOverride ? Number(trx.openingStockOverride) : chronologicalStock;
                const closing = opening + r + ret - i;
                stockByDate[trx.date || ''] = { opening, closing };
                chronologicalStock = closing;
            });

            if (cachedTransactions.length === 0) {
                historyContainer.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-sm p-8 text-center text-gray-500 border border-gray-100 flex flex-col items-center justify-center">
                        <div class="bg-gray-50 w-16 h-16 rounded-full flex items-center justify-center mb-3">
                            <i class="fas fa-folder-open text-2xl text-gray-300"></i>
                        </div>
                        <p class="font-medium">කිසිදු දෛනික චලනයක් (Movements) නැත.</p>
                        <p class="text-sm mt-1">දැනට පවතින Closing Stock: <b class="text-blue-600">${baseOpeningStock}</b></p>
                    </div>
                `;
                return;
            }

            const isMobile = window.innerWidth < 768;
            let htmlContent = '';

            if (isMobile) {
                htmlContent = `<div class="space-y-4">`;
                cachedTransactions.forEach(trx => {
                    const r = Number(trx.receive || 0);
                    const i = Number(trx.issue || 0);
                    const ret = Number(trx.return || 0);
                    const stock = stockByDate[trx.date || ''] || { opening: baseOpeningStock, closing: baseOpeningStock };
                    const openingStock = stock.opening;
                    const closingStock = stock.closing;

                    htmlContent += `
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 relative overflow-hidden transition-all hover:shadow-md">
                            <div class="flex justify-between items-center mb-3 border-b border-gray-50 pb-2">
                                <div class="flex items-center gap-2">
                                    <div class="bg-blue-100 text-blue-600 p-1.5 rounded-lg"><i class="fas fa-calendar-day text-xs"></i></div>
                                    <span class="font-bold text-gray-800 text-sm">${escapeHtml(trx.date)}</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <div class="text-right">
                                        <span class="text-[10px] text-gray-400 font-bold uppercase tracking-wider block">Op. Stock</span>
                                        <span class="font-semibold text-gray-600">${openingStock}</span>
                                    </div>
                                    <button type="button" onclick="editDateOpeningStock('${escapeHtml(trx.date || '')}')" class="w-9 h-9 rounded-full bg-amber-50 text-amber-600 hover:bg-amber-100 flex items-center justify-center transition" title="Edit Op. Stock">
                                        <i class="fas fa-pen text-xs"></i>
                                    </button>
                                    <button type="button" onclick="deleteDateRecords('${escapeHtml(trx.date || '')}')" class="w-9 h-9 rounded-full bg-red-50 text-red-600 hover:bg-red-100 flex items-center justify-center transition" title="Delete this date">
                                        <i class="fas fa-trash-alt text-xs"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div class="flex justify-between items-center bg-gray-50 rounded-xl p-3 mb-3">
                                <div class="text-center w-1/3 border-r border-gray-200">
                                    <span class="text-[10px] text-green-600 font-bold uppercase block mb-1">Rec (+)</span>
                                    <span class="font-black text-green-600">${r > 0 ? r : '-'}</span>
                                </div>
                                <div class="text-center w-1/3 border-r border-gray-200">
                                    <span class="text-[10px] text-red-600 font-bold uppercase block mb-1">Iss (-)</span>
                                    <span class="font-black text-red-600">${i > 0 ? i : '-'}</span>
                                </div>
                                <div class="text-center w-1/3">
                                    <span class="text-[10px] text-blue-500 font-bold uppercase block mb-1">Ret (+)</span>
                                    <span class="font-black text-blue-500">${ret > 0 ? ret : '-'}</span>
                                </div>
                            </div>
                            
                            <div class="flex justify-between items-center bg-blue-600 text-white rounded-xl p-3 shadow-inner">
                                <span class="text-xs font-bold uppercase tracking-wider">Closing Stock</span>
                                <span class="text-xl font-black">${closingStock}</span>
                            </div>
                        </div>
                    `;
                });
                htmlContent += `</div>`;
            } else {
                htmlContent = `
                    <div class="bg-white rounded-2xl shadow-md overflow-hidden border border-gray-100">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider border-b border-gray-200">
                                    <th class="p-4 font-bold">Date</th>

        async function editDateOpeningStock(dateVal) {
            if (!dateVal || !currentMaterialCode) return;

            // Require the same admin password used for other protected stock actions.
            const passwordResult = await Swal.fire({
                title: 'Admin Password',
                text: `${dateVal} දිනයේ Op. Stock වෙනස් කිරීමට Admin Password එක ඇතුලත් කරන්න.`,
                input: 'password',
                inputPlaceholder: 'Admin Password',
                inputAttributes: {
                    autocapitalize: 'off',
                    autocorrect: 'off',
                    autocomplete: 'off',
                    inputmode: 'numeric',
                    maxlength: 4
                },
                showCancelButton: true,
                confirmButtonText: 'Verify',
                cancelButtonText: 'Cancel',
                confirmButtonColor: '#2563eb',
                reverseButtons: true,
                inputValidator: (value) => {
                    if (!value) return 'කරුණාකර Admin Password එක ඇතුලත් කරන්න.';
                    if (String(value) !== '0009') return 'Password එක වැරදියි.';
                    return undefined;
                }
            });

            if (!passwordResult.isConfirmed || String(passwordResult.value) !== '0009') return;

            const trxForDate = cachedTransactions.find(trx => trx.date === dateVal);
            if (!trxForDate) {
                Swal.fire('Error', `${dateVal} දිනයට අදාල movement record එක හමු නොවීය.`, 'error');
                return;
            }

            const currentStock = (trxForDate.openingStockOverride !== undefined && trxForDate.openingStockOverride !== null && trxForDate.openingStockOverride !== '')
                ? Number(trxForDate.openingStockOverride)
                : (() => {
                    const sorted = [...cachedTransactions].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
                    let running = baseOpeningStock;
                    for (const trx of sorted) {
                        const override = trx.openingStockOverride !== undefined && trx.openingStockOverride !== null && trx.openingStockOverride !== ''
                            ? Number(trx.openingStockOverride) : running;
                        if (trx.date === dateVal) return override;
                        running = override + Number(trx.receive || 0) + Number(trx.return || 0) - Number(trx.issue || 0);
                    }
                    return running;
                })();

            const result = await Swal.fire({
                title: 'Edit Op. Stock',
                html: `<div class="text-sm text-gray-500 mb-2"><b>${escapeHtml(dateVal)}</b> දිනයේ සිට ඉදිරියට stock calculation එක මෙම අගයෙන් ආරම්භ වේ.</div>`,
                input: 'number',
                inputValue: currentStock,
                inputAttributes: { min: '0', step: 'any', inputmode: 'decimal' },
                inputPlaceholder: 'Op. Stock',
                showCancelButton: true,
                confirmButtonText: 'Save',
                cancelButtonText: 'Cancel',
                confirmButtonColor: '#16a34a',
                reverseButtons: true,
                inputValidator: (value) => {
                    if (value === '' || value === null || value === undefined) return 'කරුණාකර Op. Stock අගයක් ඇතුලත් කරන්න.';
                    if (!Number.isFinite(Number(value)) || Number(value) < 0) return '0 හෝ ඊට වැඩි නිවැරදි අගයක් ඇතුලත් කරන්න.';
                    return undefined;
                }
            });

            if (!result.isConfirmed) return;

            const newOpeningStock = Number(result.value);
            if (!Number.isFinite(newOpeningStock) || newOpeningStock < 0) return;

            try {
                Swal.fire({
                    title: 'Saving...',
                    text: 'Op. Stock සහ ඉදිරි stock calculations යාවත්කාලීන කරමින් පවතී.',
                    allowOutsideClick: false,
                    didOpen: () => Swal.showLoading()
                });

                // Store the override only on this date. renderHistoryTable() uses
                // this value for the selected date and carries its closing stock
                // forward to all following dates automatically.
                const dateRecords = cachedTransactions.filter(trx => trx.date === dateVal && trx.__docId);
                const batch = db.batch();
                dateRecords.forEach(trx => {
                    batch.update(db.collection('transactions').doc(trx.__docId), {
                        openingStockOverride: newOpeningStock
                    });
                });
                await batch.commit();

                cachedTransactions.forEach(trx => {
                    if (trx.date === dateVal) trx.openingStockOverride = newOpeningStock;
                });

                renderHistoryTable();

                await Swal.fire({
                    title: 'සාර්ථකයි!',
                    text: `${dateVal} දිනයේ Op. Stock ${newOpeningStock} ලෙස සකස් කරන ලදී. එම දිනයෙන් පසු stock calculations නැවත ගණනය විය.`,
                    icon: 'success',
                    timer: 1800,
                    showConfirmButton: false
                });
            } catch (err) {
                console.error('Date Opening Stock Update Error:', err);
                if (err.code === 'permission-denied') {
                    Swal.fire('Permission Error', 'Op. Stock වෙනස් කිරීමට ඔබට අවසර නොමැත.', 'error');
                } else {
                    Swal.fire('Error', 'Op. Stock යාවත්කාලීන කිරීමේදී දෝෂයක් සිදු විය: ' + (err.message || err), 'error');
                }
            }
        }

        async function saveTransactionRecord() {
            const dateVal = document.getElementById('input-date').value;
            const receiveVal = Number(document.getElementById('input-receive').value) || 0;
            const issueVal = Number(document.getElementById('input-issue').value) || 0;
            const returnVal = Number(document.getElementById('input-return').value) || 0;

            if (!dateVal) {
                Swal.fire('Warning', 'කරුණාකර දිනයක් තෝරන්න.', 'warning');
                return;
            }

            if (receiveVal === 0 && issueVal === 0 && returnVal === 0) {
                Swal.fire('Warning', 'අවම වශයෙන් එක් අගයක්වත් ඇතුලත් කරන්න.', 'warning');
                return;
            }

            const docId = `${safeDocId}_${dateVal}`;

            try {
                Swal.fire({ title: 'Saving...', text: 'කරුණාකර රැඳී සිටින්න', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

                await db.collection('transactions').doc(docId).set({
                    materialCode: currentMaterialCode,
                    date: dateVal,
                    receive: firebase.firestore.FieldValue.increment(receiveVal),
                    issue: firebase.firestore.FieldValue.increment(issueVal),
                    return: firebase.firestore.FieldValue.increment(returnVal)
                }, { merge: true });

                closeModal();
                
                Swal.fire({
                    title: 'සාර්ථකයි!',
                    text: 'දත්ත යාවත්කාලීන විය.',
                    icon: 'success',
                    timer: 1200,
                    showConfirmButton: false
                });

                loadItemBinCard();

            } catch (err) {
                console.error("Save Data Error:", err);
                if (err.code === 'permission-denied') {
                    Swal.fire('Permission Error', 'ඔබට දත්ත ඇතුලත් කිරීමට අවසර නොමැත.', 'error');
                } else {
                    Swal.fire('Error', 'දෝෂයක් සිදු විය: ' + err.message, 'error');
                }
            }
        }

        // Fast render on window resize without re-triggering network queries
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                renderHistoryTable();
            }, 150);
        });

        window.addEventListener('DOMContentLoaded', loadItemBinCard);
    </script>

<script id="bin-card-themes-item-script">

    function normalizeTheme(theme){
        theme=String(theme||'').trim().toLowerCase();

    }

    function getLocalTheme(){
        try{return normalizeTheme(localStorage.getItem(KEY)||'original');}
        catch(e){return 'original';}
    }

    function applyTheme(theme){
        theme=normalizeTheme(theme);
        const themeClasses=ALLOWED.map(t=>'bin-theme-'+t);
        document.body.classList.remove(...themeClasses);

        document.documentElement.setAttribute('data-bin-card-theme',theme);
        document.body.setAttribute('data-bin-card-theme',theme);
        try{localStorage.setItem(KEY,theme);}catch(e){}
        return theme;
    }

    // Apply local cached value immediately to avoid a blank/default appearance.
    applyTheme(getLocalTheme());

    function getFirestore(){
        try{
            if(window.db && typeof window.db.collection==='function') return window.db;

        try{
            const firestore=getFirestore();
            if(firestore){
                const snap=await firestore.collection(SETTINGS_COLLECTION).doc(SETTINGS_DOC).get();
                if(snap.exists){
                    const theme=normalizeTheme((snap.data()||{}).binCardTheme);
                    applyTheme(theme);
                    return theme;
                }
            }
        }catch(err){
            console.warn('Shared Bin Card Theme read failed; keeping local cached theme.',err);
        }
        return getLocalTheme();
    }

    window.binCardThemes={
        get:function(){return getLocalTheme();},
        set:function(theme){return applyTheme(theme);},
        apply:function(){return applyTheme(getLocalTheme());},
        loadShared:loadSharedTheme
    };

    // Firebase is initialized by the main item.html script before this additive script.
    // Load the authoritative shared theme after initialization.
    if(document.readyState==='loading'){
        document.addEventListener('DOMContentLoaded',loadSharedTheme,{once:true});
    }else{
        loadSharedTheme();
    }

    // Same-tab integrations.
    window.addEventListener('bin-card-theme-change',function(e){
        if(e && e.detail) applyTheme(e.detail.theme);
    });

    // Other tabs/windows on the same browser.
    window.addEventListener('storage',function(e){
        if(e.key===KEY && e.newValue) applyTheme(e.newValue);
    });
})();
</script>
